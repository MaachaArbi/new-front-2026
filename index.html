<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inter — même police que le socle Metronic dont viennent nos tokens.
         Sans elle, l'app rend avec la police système : c'est ce qui donnait
         l'impression « générique » malgré des tokens identiques. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <title>OsTravel Back Office</title>
    <script>
      // Réglages d'affichage appliqués avant la première peinture (cf.
      // src/app/providers/display-preferences.tsx). Sans ce script, l'écran
      // s'affiche au défaut puis saute au choix de l'utilisateur.
      (function () {
        try {
          var d = JSON.parse(localStorage.getItem('ostravel-display') || '{}')
          var r = document.documentElement
          r.dataset.accent = d.accent || 'teal'
          r.dataset.sidebar = d.sidebar || 'dark'
          r.dataset.font = d.font || 'inter'
        } catch (e) {
          document.documentElement.dataset.sidebar = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
